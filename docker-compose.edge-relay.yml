services:
  beamsync-edge-relay:
    build:
      context: .
      dockerfile: Dockerfile.edge-relay
    container_name: beamsync-edge-relay
    restart: unless-stopped
    ports:
      - "${PORT:-8443}:${PORT:-8443}/tcp"
      - "${STUN_PORT:-3478}:3478/udp"
    environment:
      REGION: "${REGION:-sha}"
      PUBLIC_IP: "${PUBLIC_IP:-}"
      PUBLIC_RELAY_URL: "${PUBLIC_RELAY_URL:-}"
      TLS_MODE: "${TLS_MODE:-self-signed}"
      PORT: "${PORT:-8443}"
      STUN_PORT: "3478"
      COORDINATOR_URL: "${COORDINATOR_URL:-}"
      RELAY_AUTH_SECRET: "${RELAY_AUTH_SECRET}"
      TLS_CACHE_FILE: "/tls/edge-relay-tls.json"
    volumes:
      - beamsync_edge_relay_tls:/tls

volumes:
  beamsync_edge_relay_tls:
